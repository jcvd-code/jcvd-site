<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>JCVD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,200;0,300;0,400;0,500;1,300&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="assets/engine.css">

<div id="ground"></div>
<div id="pframe"></div>
<div id="spacer"></div>
<main id="stage" class="layer"></main>
<div id="veilTop" class="veil"></div><div id="veilCol" class="veil"></div><div id="veilBot" class="veil"></div>
<div id="chrome" class="layer">
  <div id="menupanel"></div>
  <div id="tiles" aria-label="JCVD home"></div>
  <span id="partnertag"></span>
  <nav id="menu" aria-label="Main">
    <a class="mn" href="#about" data-k="about">ABOUT</a>
    <a class="mn" href="#projects" data-k="projects">PROJECTS</a>
    <a class="mn" href="#products" data-k="products">PRODUCTS</a>
    <a class="mn" href="#contact" data-k="contact">CONTACT</a>
  </nav>
  <a id="crumb" class="go"></a>
  <button id="cartbtn" type="button" aria-label="Open cart"><svg viewBox="5 21.5 31 22" fill="none" stroke="currentColor" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 27.5L6.5 42L34.5 42L34.5 23"/><path d="M6.5 27.5C14 26.5 20 26.2 26 24.8C29 24.1 32 23.4 34.5 23"/><path d="M6.5 27.5C7.4 30 8.4 32.4 9.6 34.6C19.5 32.2 28.5 26.8 34.5 23"/></svg><span class="n"></span></button>
  <div id="footer"></div>
</div>

<div id="scrim"></div>
<aside id="cart" aria-label="Cart">
  <header><span>Cart</span><button type="button" class="close"><u>close</u></button></header>
  <div class="items"></div>
  <footer>
    <div class="tot"><span>Total</span><b></b></div>
    <span>Shipping and taxes are calculated at checkout. <button type="button" class="pol"><u>Terms &amp; policies</u></button></span>
    <button type="button" class="checkout">Checkout</button>
    <span class="note"></span>
  </footer>
</aside>

<script src="assets/content.js"></script>
<script src="assets/scenes.js"></script>
<script src="assets/engine.js"></script>


</body></html>
